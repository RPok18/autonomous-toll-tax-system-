services:
  postgres:
    image: postgres:16
    container_name: toll_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toll_app
      POSTGRES_PASSWORD: toll_app
      POSTGRES_DB: toll_system
    ports:
      - "5432:5432"
    volumes:
      - toll_pgdata:/var/lib/postgresql/data
      

volumes:
  toll_pgdata: