services:
  postgres:
    image: postgres:16
    container_name: toll_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - toll_pgdata:/var/lib/postgresql/data

volumes:
  toll_pgdata:
